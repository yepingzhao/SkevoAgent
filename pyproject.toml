[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skevo"
version = "0.1.0"
description = "A self-evolving harness agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
skevo = "agents.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agents"]
